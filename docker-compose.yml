services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediahub
      POSTGRES_PASSWORD: mediahub
      POSTGRES_DB: mediahub
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediahub"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    command: uvicorn app.webhook:app --host 0.0.0.0 --port 8080
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mediahub:mediahub@db:5432/mediahub
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mediahub:mediahub@db:5432/mediahub
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    command: uvicorn app.api:app --host 0.0.0.0 --port 8081
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mediahub:mediahub@db:5432/mediahub
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
